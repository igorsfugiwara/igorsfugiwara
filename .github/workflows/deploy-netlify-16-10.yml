# Dispara de uma vez os deploys da Netlify que ficaram na fila enquanto a conta
# estava sem crédito (ciclo renova em 16/10/2026, às 04h de Brasília).
#
# Cada site tem um "build hook" da Netlify: um endereço que, chamado com POST,
# refaz o deploy do último commit da main. Os endereços ficam em segredos do
# repositório (HOOK_*) — quem tem um deles dispara deploy e gasta crédito.
#
# Roda sozinho uma vez, em 16/10/2026 às 09h de Brasília. O cron do GitHub
# repete todo ano, então a execução agendada confere o ano e não faz nada fora
# de 2026. Pela aba Actions dá para rodar na mão: "simular" só confere se os
# segredos existem, sem disparar nada.
name: Deploy Netlify 16/10

on:
  schedule:
    - cron: '0 12 16 10 *' # 12h UTC = 09h de Brasília
  workflow_dispatch:
    inputs:
      simular:
        description: 'Só conferir os segredos, sem disparar deploy'
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploys
        env:
          HOOK_PORTFOLIO: ${{ secrets.HOOK_PORTFOLIO }}
          HOOK_PDV_CASA_O: ${{ secrets.HOOK_PDV_CASA_O }}
          HOOK_CATAN: ${{ secrets.HOOK_CATAN }}
          HOOK_POKE_TRUNFO: ${{ secrets.HOOK_POKE_TRUNFO }}
          HOOK_LINKTREE_ESCOMBRO: ${{ secrets.HOOK_LINKTREE_ESCOMBRO }}
          EVENTO: ${{ github.event_name }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          if [ "$EVENTO" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "Agendamento feito para 2026. Em $(date -u +%Y) não faz nada."
            exit 0
          fi

          falhas=0
          for nome in HOOK_PORTFOLIO HOOK_PDV_CASA_O HOOK_CATAN HOOK_POKE_TRUNFO HOOK_LINKTREE_ESCOMBRO; do
            url="${!nome}"
            if [ -z "$url" ]; then
              echo "::error::$nome não está configurado nos segredos do repositório."
              falhas=$((falhas + 1))
              continue
            fi
            if [ "$SIMULAR" = "true" ]; then
              echo "$nome configurado (simulação: nada disparado)."
              continue
            fi
            if curl -fsS -X POST -d '{}' "$url" > /dev/null; then
              echo "$nome: deploy disparado."
            else
              echo "::error::$nome: a Netlify recusou o disparo."
              falhas=$((falhas + 1))
            fi
          done

          [ "$falhas" -eq 0 ] || exit 1
